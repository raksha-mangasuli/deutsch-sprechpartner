<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#3E2F52">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Sprechpartner">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <title>Deutsch Sprechpartner</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="assets/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="assets/apple-touch-icon.png">
  <link rel="stylesheet" href="css/styles.css">
  <link rel="stylesheet" href="css/avatar.css">
</head>
<body>
  <div class="app">
    <header class="topbar">
      <div class="brand">
        <img class="brand-icon" src="assets/icon.svg" alt="" width="44" height="44">
        <div>
          <h1>Deutsch Sprechpartner</h1>
          <p class="tagline">Sprich einfach drauflos.</p>
        </div>
      </div>
      <div class="topbar-actions">
        <button id="btn-new" class="icon-btn" type="button" title="New conversation" aria-label="New conversation">+</button>
        <button id="btn-settings" class="icon-btn" type="button" title="Settings" aria-label="Settings">&#9881;</button>
      </div>
    </header>

    <section class="options-card" aria-label="Session options">
      <div class="opt-group">
        <svg class="opt-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 20V14M12 20V9M18 20V4"/></svg>
        <label class="opt-text">
          <span class="opt-label">Level</span>
          <select id="sel-level">
            <option value="A2">A2</option>
            <option value="B1">B1</option>
            <option value="B2">B2</option>
            <option value="C1">C1</option>
          </select>
        </label>
      </div>
      <span class="opt-divider" aria-hidden="true"></span>
      <div class="opt-group">
        <svg class="opt-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 20l4-1L19 8a2.1 2.1 0 0 0-3-3L5 16l-1 4z"/></svg>
        <div class="opt-text">
          <span class="opt-label">Corrections</span>
          <div id="mode-group" class="segmented" role="group" aria-label="Correction mode">
            <button type="button" id="mode-each" data-mode="each" aria-label="Each message"><span class="long">Each message</span><span class="short" aria-hidden="true">Each</span></button>
            <button type="button" id="mode-end" data-mode="end" aria-label="At the end"><span class="long">At the end</span><span class="short" aria-hidden="true">End</span></button>
          </div>
        </div>
      </div>
      <button id="btn-end" class="end-btn" type="button">End and review</button>
    </section>

    <div class="workspace">
      <div class="partner-col">
        <div id="avatar" class="avatar-wrap"></div>
        <p class="partner"><strong id="partner-name"></strong><span id="partner-tagline"></span></p>
      </div>

      <div class="convo">
      <main id="chat" class="chat" aria-live="polite"></main>

      <div id="status" class="status" hidden></div>

      <form id="composer" class="composer" autocomplete="off">
        <button id="btn-mic" class="mic" type="button" aria-label="Speak" title="Speak German">
          <svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true"><path fill="currentColor" d="M12 15a3 3 0 0 0 3-3V6a3 3 0 0 0-6 0v6a3 3 0 0 0 3 3zm5-3a5 5 0 0 1-10 0H5a7 7 0 0 0 6 6.92V22h2v-3.08A7 7 0 0 0 19 12h-2z"/></svg>
        </button>
        <textarea id="text" rows="1" placeholder="Schreib oder sprich..." aria-label="Message"></textarea>
        <button id="btn-send" class="send" type="submit" aria-label="Send">Senden</button>
      </form>
      </div>
    </div>
  </div>

  <dialog id="dlg-settings" aria-labelledby="settings-title">
    <form method="dialog" class="dlg">
      <h2 id="settings-title">Settings</h2>

      <label class="stack">
        <span>Anthropic API key</span>
        <input id="set-key" type="password" placeholder="sk-ant-..." autocomplete="off" spellcheck="false">
        <small>Stored only in this browser. Create one at console.anthropic.com and set a monthly spend limit there.</small>
      </label>

      <label class="stack">
        <span>Model</span>
        <input id="set-model" type="text" spellcheck="false">
        <small>A small, fast model is plenty for conversation practice.</small>
      </label>

      <fieldset class="avatar-picker">
        <legend>Conversation partner</legend>
        <div id="set-avatar" class="avatar-options"></div>
      </fieldset>

      <label class="stack">
        <span>Voice</span>
        <select id="set-voice"></select>
        <small>Automatic picks a voice that suits the person you are talking to.</small>
      </label>

      <label class="stack">
        <span>Speaking speed <output id="out-rate"></output></span>
        <input id="set-rate" type="range" min="0.6" max="1.2" step="0.05">
      </label>

      <label class="check"><input id="set-autospeak" type="checkbox"> Read replies aloud</label>
      <label class="check"><input id="set-autosend" type="checkbox"> Send automatically 3 seconds after I speak</label>

      <div class="row">
        <button id="btn-testvoice" type="button" class="secondary">Test voice</button>
        <button id="btn-clearmistakes" type="button" class="secondary">Clear mistake memory</button>
      </div>
      <p id="mistake-count" class="muted"></p>

      <div class="row end">
        <button id="btn-cancel" type="button" class="secondary">Cancel</button>
        <button id="btn-save" value="save" class="primary">Save</button>
      </div>
    </form>
  </dialog>

  <dialog id="dlg-summary" aria-labelledby="summary-title">
    <form method="dialog" class="dlg">
      <h2 id="summary-title">Session review</h2>
      <div id="summary-body" class="summary"></div>
      <div class="row end">
        <button class="primary" value="close">Close</button>
      </div>
    </form>
  </dialog>

  <script type="module" src="js/main.js"></script>
</body>
</html>
